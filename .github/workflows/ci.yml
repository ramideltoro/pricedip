name: Validate PriceDip
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with: {path: app, fetch-depth: 0}
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with: {repository: ramideltoro/pricedip-wiki, path: wiki}
      - uses: actions/setup-node@db0fb3a98ed314b69026b6e8c9be26a7e2fe65a8
        with: {node-version: '22.22.1', cache: npm, cache-dependency-path: app/package-lock.json}
      - name: Require documentation declaration
        if: github.event_name == 'pull_request'
        run: node app/scripts/check-pr.mjs
      - run: npm ci && npm test
        working-directory: app
      - run: npm audit --omit=dev --audit-level=high
        working-directory: app
      - run: node app/scripts/docs.mjs check wiki app
      - run: npm ci && npm run check && npm run build
        working-directory: wiki
